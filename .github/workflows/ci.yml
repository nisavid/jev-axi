name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: [22, 24]
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm verify
      - id: caller-node
        run: node -e "require('node:fs').appendFileSync(process.env.GITHUB_OUTPUT, 'node=' + process.execPath + '\n')"
      - name: Exercise composite Action without credentials
        uses: ./
        with:
          api-key: ""
          github-token: ""
          comment: "false"
      - name: Preserve caller Node selection
        run: node -e "require('node:assert/strict').equal(process.execPath, process.env.EXPECTED_NODE)"
        env:
          EXPECTED_NODE: ${{ steps.caller-node.outputs.node }}

  required:
    name: CI gate
    needs: [test]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 1
    permissions: {}
    steps:
      - name: Check required job results
        if: ${{ always() }}
        shell: sh
        working-directory: .
        env:
          NEEDS_RESULTS: ${{ join(needs.*.result, ',') }}
        run: |
          printf 'Needed job results: %s\n' "$NEEDS_RESULTS"
          remaining=$NEEDS_RESULTS
          while :; do
            case "$remaining" in
              success) exit 0 ;;
              success,*) remaining=${remaining#*,} ;;
              *) exit 1 ;;
            esac
          done
